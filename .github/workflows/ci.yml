name: CI

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'spec/**'
      - 'docs/**'
      - 'document/**'
      - 'AGENTS.md'
      - '.opencode/**'
  push:
    branches:
      - develop
      - master
    paths-ignore:
      - 'README.md'
      - 'spec/**'
      - 'docs/**'
      - 'document/**'
      - 'AGENTS.md'
      - '.opencode/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: true

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

  db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: developer
          POSTGRES_DB: harmonica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U developer -d harmonica_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_USER: developer
          MYSQL_PASSWORD: developer
          MYSQL_DATABASE: harmonica_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      HARMONICA_TEST_DB_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run DB integration suite
        run: ./gradlew :integration-test:integrationTest --no-daemon
